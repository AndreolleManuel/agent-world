[package]
name = "pixel-ops"
version = "0.2.0"
license = "MIT"
description = "Read-only Hermes heartbeat viewer"
edition = "2024"

[lib]
name = "pixel_ops_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
base64 = "0.22.1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tauri = { version = "2", features = [] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
