[package]
name = "agent-world-collector"
version = "0.2.0"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits", "serialize"] }
libc = "0.2"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
