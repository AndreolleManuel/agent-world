[package]
name = "agent-world-collector"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
