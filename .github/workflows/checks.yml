name: Source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy && rustup default 1.98.0
      - run: npm ci
      - run: npm run lint && npm test && npm run test:release && npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify signed update installation on an isolated synthetic bundle
        run: python3 scripts/test-update-install.py
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm audit --audit-level=low
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock && cargo audit --file collector/Cargo.lock && cargo audit --file reader/Cargo.lock
      - run: npm run audit:public
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 build-essential
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy && rustup default 1.98.0
      - run: cargo test --locked --manifest-path collector/Cargo.toml && cargo test --locked --manifest-path reader/Cargo.toml
      - run: cargo clippy --locked --manifest-path collector/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path reader/Cargo.toml --all-targets -- -D warnings
